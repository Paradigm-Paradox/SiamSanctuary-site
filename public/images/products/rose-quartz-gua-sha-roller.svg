<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#262322" />
      <stop offset="60%" stop-color="#161616" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </radialGradient>

    <!-- Product Shading Gradient -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2726" />
      <stop offset="50%" stop-color="#1f1c1b" />
      <stop offset="100%" stop-color="#141312" />
    </linearGradient>

    <!-- Gold/Rose Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bgGlow)" />

  <!-- Luxury Outer Border Frame -->
  <rect x="25" y="25" width="550" height="550" rx="24" fill="none" stroke="#f9a8d4" stroke-width="1.5" opacity="0.35" />
  <rect x="35" y="35" width="530" height="530" rx="16" fill="none" stroke="#f9a8d4" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 6" />

  <!-- Top Brand Tag -->
  <g transform="translate(300, 65)">
    <rect x="-105" y="-12" width="210" height="24" rx="12" fill="#141414" stroke="#f9a8d4" stroke-width="1.2" opacity="0.85" />
    <text x="0" y="4" fill="#f9a8d4" font-size="9" font-family="'Cinzel', 'Playfair Display', serif" font-weight="600" text-anchor="middle" letter-spacing="2.5">DREAM SALON ASIA</text>
  </g>

  <!-- Subtle Center Halo Glow -->
  <circle cx="300" cy="275" r="140" fill="#f9a8d4" opacity="0.06" filter="url(#glow)" />

  <!-- Main Product Vector Silhouette -->
  
        <g transform="translate(300, 270)" stroke="#f9a8d4" stroke-width="4" fill="none">
            <!-- Roller handle -->
            <line x1="-50" y1="-40" x2="-50" y2="120" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
            <!-- Top large roller stone -->
            <rect x="-85" y="-85" width="70" height="30" rx="15" fill="url(#grad1)" stroke="#f9a8d4" stroke-width="5"/>
            <!-- Bottom small roller stone -->
            <rect x="-75" y="130" width="50" height="24" rx="12" fill="url(#grad1)" stroke="#f9a8d4" stroke-width="5"/>
            <!-- Roller bracket arms -->
            <path d="M -85 -70 L -50 -55 L -15 -70" stroke="#f9a8d4" stroke-width="4"/>
            <path d="M -75 142 L -50 130 L -25 142" stroke="#f9a8d4" stroke-width="4"/>
            <!-- Gua Sha stone on right side -->
            <path d="M 50 -60 C 70 -75 95 -60 100 -35 C 110 20 85 80 50 120 C 35 70 30 0 35 -35 C 38 -55 45 -65 50 -60 Z" fill="url(#grad1)" stroke="#f9a8d4" stroke-width="6"/>
            <!-- Mineral veining -->
            <path d="M 55 -20 C 70 10 75 50 65 80" stroke="#f43f5e" stroke-width="2" opacity="0.6"/>
        </g>
        

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 500)">
    <text x="0" y="-15" fill="#ffffff" font-size="18" font-family="'Playfair Display', serif" font-weight="600" text-anchor="middle" letter-spacing="0.5">Rose Quartz Sculpting Set</text>
    <text x="0" y="8" fill="#f9a8d4" font-size="11" font-family="'Inter', sans-serif" font-weight="400" text-anchor="middle" letter-spacing="1.5">Lymphatic Gua Sha & Facial Roller</text>
    
    <!-- Mini divider -->
    <line x1="-30" y1="22" x2="30" y2="22" stroke="#f9a8d4" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="22" r="2" fill="#f9a8d4"/>
  </g>
</svg>
