<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#262322" />
      <stop offset="60%" stop-color="#161616" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </radialGradient>

    <!-- Product Shading Gradient -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2726" />
      <stop offset="50%" stop-color="#1f1c1b" />
      <stop offset="100%" stop-color="#141312" />
    </linearGradient>

    <!-- Gold/Rose Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bgGlow)" />

  <!-- Luxury Outer Border Frame -->
  <rect x="25" y="25" width="550" height="550" rx="24" fill="none" stroke="#d9c1a3" stroke-width="1.5" opacity="0.35" />
  <rect x="35" y="35" width="530" height="530" rx="16" fill="none" stroke="#d9c1a3" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 6" />

  <!-- Top Brand Tag -->
  <g transform="translate(300, 65)">
    <rect x="-105" y="-12" width="210" height="24" rx="12" fill="#141414" stroke="#d9c1a3" stroke-width="1.2" opacity="0.85" />
    <text x="0" y="4" fill="#d9c1a3" font-size="9" font-family="'Cinzel', 'Playfair Display', serif" font-weight="600" text-anchor="middle" letter-spacing="2.5">SIAM SANCTUARY</text>
  </g>

  <!-- Subtle Center Halo Glow -->
  <circle cx="300" cy="275" r="140" fill="#d9c1a3" opacity="0.06" filter="url(#glow)" />

  <!-- Main Product Vector Silhouette -->
  
        <g transform="translate(300, 260)" stroke="#d9c1a3" stroke-width="4" fill="none" stroke-linecap="round">
            <path d="M -140 -80 C -80 -100 80 -100 140 -80 C 150 -50 150 -10 140 20 L -140 20 C -150 -10 -150 -50 -140 -80 Z" fill="url(#grad1)" opacity="0.3"/>
            <path d="M -140 -80 C -80 -100 80 -100 140 -80 C 150 -50 150 -10 140 20 L -140 20 C -150 -10 -150 -50 -140 -80 Z" stroke="#d9c1a3" stroke-width="6"/>
            <!-- Teeth -->
            <line x1="-120" y1="20" x2="-120" y2="150" stroke="#d9c1a3" stroke-width="7" stroke-linecap="round"/><line x1="-98" y1="20" x2="-98" y2="150" stroke="#d9c1a3" stroke-width="7" stroke-linecap="round"/><line x1="-76" y1="20" x2="-76" y2="150" stroke="#d9c1a3" stroke-width="7" stroke-linecap="round"/><line x1="-54" y1="20" x2="-54" y2="150" stroke="#d9c1a3" stroke-width="7" stroke-linecap="round"/><line x1="-32" y1="20" x2="-32" y2="150" stroke="#d9c1a3" stroke-width="7" stroke-linecap="round"/><line x1="-10" y1="20" x2="-10" y2="150" stroke="#d9c1a3" stroke-width="7" stroke-linecap="round"/><line x1="12" y1="20" x2="12" y2="150" stroke="#d9c1a3" stroke-width="7" stroke-linecap="round"/><line x1="34" y1="20" x2="34" y2="150" stroke="#d9c1a3" stroke-width="7" stroke-linecap="round"/><line x1="56" y1="20" x2="56" y2="150" stroke="#d9c1a3" stroke-width="7" stroke-linecap="round"/><line x1="78" y1="20" x2="78" y2="150" stroke="#d9c1a3" stroke-width="7" stroke-linecap="round"/><line x1="100" y1="20" x2="100" y2="150" stroke="#d9c1a3" stroke-width="7" stroke-linecap="round"/><line x1="122" y1="20" x2="122" y2="150" stroke="#d9c1a3" stroke-width="7" stroke-linecap="round"/>
            <!-- Wood grain lines -->
            <path d="M -100 -50 C -40 -65 40 -35 100 -50" stroke="#a88a68" stroke-width="2" opacity="0.6"/>
            <path d="M -80 -30 C -20 -45 60 -15 110 -30" stroke="#a88a68" stroke-width="2" opacity="0.6"/>
        </g>
        

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 500)">
    <text x="0" y="-15" fill="#ffffff" font-size="18" font-family="'Playfair Display', serif" font-weight="600" text-anchor="middle" letter-spacing="0.5">Green Sandalwood Comb</text>
    <text x="0" y="8" fill="#d9c1a3" font-size="11" font-family="'Inter', sans-serif" font-weight="400" text-anchor="middle" letter-spacing="1.5">Hand-Carved Wide Tooth • Anti-Static</text>
    
    <!-- Mini divider -->
    <line x1="-30" y1="22" x2="30" y2="22" stroke="#d9c1a3" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="22" r="2" fill="#d9c1a3"/>
  </g>
</svg>
