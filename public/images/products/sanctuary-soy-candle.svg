<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#262322" />
      <stop offset="60%" stop-color="#161616" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </radialGradient>

    <!-- Product Shading Gradient -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2726" />
      <stop offset="50%" stop-color="#1f1c1b" />
      <stop offset="100%" stop-color="#141312" />
    </linearGradient>

    <!-- Gold/Rose Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bgGlow)" />

  <!-- Luxury Outer Border Frame -->
  <rect x="25" y="25" width="550" height="550" rx="24" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.35" />
  <rect x="35" y="35" width="530" height="530" rx="16" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 6" />

  <!-- Top Brand Tag -->
  <g transform="translate(300, 65)">
    <rect x="-105" y="-12" width="210" height="24" rx="12" fill="#141414" stroke="#f59e0b" stroke-width="1.2" opacity="0.85" />
    <text x="0" y="4" fill="#f59e0b" font-size="9" font-family="'Cinzel', 'Playfair Display', serif" font-weight="600" text-anchor="middle" letter-spacing="2.5">SIAM SANCTUARY</text>
  </g>

  <!-- Subtle Center Halo Glow -->
  <circle cx="300" cy="275" r="140" fill="#f59e0b" opacity="0.06" filter="url(#glow)" />

  <!-- Main Product Vector Silhouette -->
  
        <g transform="translate(300, 280)" stroke="#f59e0b" stroke-width="4" fill="none">
            <!-- Flame & Glow -->
            <circle cx="0" cy="-115" r="28" fill="#f59e0b" opacity="0.15"/>
            <path d="M 0 -135 C -12 -115 -10 -95 0 -85 C 10 -95 12 -115 0 -135 Z" fill="#f59e0b"/>
            <line x1="0" y1="-85" x2="0" y2="-65" stroke="#ffffff" stroke-width="3"/>
            <!-- Candle Jar -->
            <rect x="-75" y="-65" width="150" height="190" rx="14" fill="url(#grad1)" stroke="#f59e0b" stroke-width="6"/>
            <!-- Wax rim line -->
            <line x1="-70" y1="-45" x2="70" y2="-45" stroke="#d97706" stroke-width="2"/>
            <!-- Luxury Label -->
            <rect x="-50" y="-10" width="100" height="110" rx="6" fill="#141414" stroke="#f59e0b" stroke-width="2"/>
            <text x="0" y="20" fill="#f59e0b" font-size="9" font-family="serif" text-anchor="middle" font-weight="bold">SIAM SANCTUARY</text>
            <text x="0" y="40" fill="#ffffff" font-size="9" font-family="sans-serif" text-anchor="middle">SANCTUARY</text>
            <text x="0" y="55" fill="#ffffff" font-size="7" font-family="sans-serif" text-anchor="middle">AMBER &amp; JASMINE</text>
            <text x="0" y="75" fill="#d97706" font-size="7" font-family="sans-serif" text-anchor="middle">100% PURE SOY WAX</text>
            <circle cx="0" cy="90" r="3" fill="#f59e0b"/>
        </g>
        

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 500)">
    <text x="0" y="-15" fill="#ffffff" font-size="18" font-family="'Playfair Display', serif" font-weight="600" text-anchor="middle" letter-spacing="0.5">Sanctuary Amber Candle</text>
    <text x="0" y="8" fill="#f59e0b" font-size="11" font-family="'Inter', sans-serif" font-weight="400" text-anchor="middle" letter-spacing="1.5">Soy Wax • White Jasmine & Warm Amber</text>
    
    <!-- Mini divider -->
    <line x1="-30" y1="22" x2="30" y2="22" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="22" r="2" fill="#f59e0b"/>
  </g>
</svg>
